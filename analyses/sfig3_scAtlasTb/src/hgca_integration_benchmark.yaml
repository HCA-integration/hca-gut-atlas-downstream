        harmonypy_Epithelial--source=lineage_integration: /lustre/groups/ml01/workspace/christopher.lance/hca_gut/hca-gut-atlas-extension/data/reproducibility/scatlasTb_out/integration/dataset~hgca_epithelial/file_id~preprocessing:split_data:hgca--split_data_key=hgca_celltype_level1--split_data_value=Epithelial/batch~donor_id/var_mask~highly_variable/method~harmonypy--hyperparams~c5fbd85180--label~None--output_type~embed.zarr
        harmonypy_Lymphoid--source=full_integration: /lustre/groups/ml01/workspace/christopher.lance/hca_gut/hca-gut-atlas-extension/data/reproducibility/scatlasTb_out/split_data/dataset~hgca_full/file_id~integration:preprocessing:hgca_full--integration=529e3ed8bd/key~hgca_celltype_level1/value~Lymphoid.zarr
        harmonypy_Lymphoid--source=lineage_integration: /lustre/groups/ml01/workspace/christopher.lance/hca_gut/hca-gut-atlas-extension/data/reproducibility/scatlasTb_out/integration/dataset~hgca_lymphoid/file_id~preprocessing:split_data:hgca--split_data_key=hgca_celltype_level1--split_data_value=Lymphoid/batch~donor_id/var_mask~highly_variable/method~harmonypy--hyperparams~c5fbd85180--label~None--output_type~embed.zarr
