name: Test Environment
on: [push, pull_request]
jobs:
  test-env:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Setup Conda
      uses: conda-incubator/setup-miniconda@v2
      with:
        activate-environment: gca
        environment-file: environment.yml
        auto-activate-base: false
    - name: Update or Create Environment
      run: |
        if conda env list | grep -q 'gca'; then
          conda env update -n gca -f environment.yml --prune
        else
          conda env create -f environment.yml
        fi
    - name: Test Python Imports
      run: conda run -n gca python -c "import scanpy, sklearn, numpy, pandas"
    - name: Test R Imports
      run: conda run -n gca Rscript -e "library(dplyr); library(Seurat); library(compositions)"
