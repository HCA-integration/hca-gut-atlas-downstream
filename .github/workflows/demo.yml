name: Demo
on:
  push:
    branches: [main]
  pull_request:
jobs:
  laptop-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Run demo
        run: python src/run_demo.py
      - name: Check smoke counts
        run: python tests/test_demo_slice.py
